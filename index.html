<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JZjj - The Adventurous Creative</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            background-color: #ffffff; /* Default white for top/bottom */
            
            /* Background Ribbon Settings */
            background-image: url('mountains.jpg');
            background-repeat: no-repeat;
            background-position: center;
            /* Adjust 50% to make the 'mountain strip' taller or shorter */
            background-size: 100% 55%; 
        }

        /* Glassmorphism Container */
        .container {
            padding: 50px 40px;
            max-width: 550px;
            background: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 1;
        }

        h1 {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            color: #1d1d1f;
        }

        p {
            font-size: 19px;
            color: #48484a;
            margin-bottom: 35px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
        }

        .btn {
            background-color: #0071e3;
            color: white;
            padding: 10px 24px;
            border-radius: 980px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #0077ed;
            transform: translateY(-2px);
        }

        .about-link {
            text-decoration: none; 
            color: #1d1d1f; 
            font-weight: 500; 
            font-size: 14px;
            margin-left: 10px;
            opacity: 0.7;
        }

        .about-link:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>The Adventurous Creative</h1>
        <p>Exploring World, Crafting Stories</p>
        
        <div class="btn-group">
            <a href="good-quotes.html" class="btn">View Quotes</a>
            <a href="blog.html" class="btn">View Blog</a>
            <a href="about.html" class="about-link">About</a>
        </div>
    </div>

</body>
</html>
