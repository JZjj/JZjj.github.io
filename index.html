<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JZjj</title>
    <style>
        /* Modern Apple/Google-inspired Styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1d1d1f;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Centers content vertically */
            text-align: center;
        }

        .container {
            padding: 20px;
            max-width: 600px;
        }

        h1 {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -0.015em;
            margin-bottom: 10px;
        }

        p {
            font-size: 24px;
            color: #86868b; /* Subtle gray subtext */
            margin-bottom: 40px;
        }

        /* Modern pill-shaped button */
        .btn {
            display: inline-block;
            background-color: #0071e3; /* Classic Apple Blue */
            color: white;
            padding: 12px 28px;
            border-radius: 980px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #0077ed;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>To be Adventurous Creative</h1>
        <p> Exploring World, Crafting Stories </p>
        
        <a href="good-quotes.html" class="btn">
            View Quotes Collection
        </a>
    </div>

</body>
</html>
