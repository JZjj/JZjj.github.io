<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Quotes Collected</title>
    <style>
        /* Modern Reset & Typography */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fbfbfd; /* Apple-style off-white */
            color: #1d1d1f;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -0.003em;
            margin-bottom: 40px;
            text-align: center;
        }

        /* The Card Design */
        .quote-card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
            transition: transform 0.3s ease;
            margin-bottom: 20px;
        }

        .quote-card:hover {
            transform: scale(1.02); /* Subtle hover lift */
        }

        .quote-text {
            font-size: 21px;
            line-height: 1.4;
            font-style: italic;
            color: #1d1d1f;
            margin: 0;
        }

        /* Button-style Link */
        .back-link {
            margin-top: 30px;
            text-decoration: none;
            color: #0066cc;
            font-weight: 500;
            font-size: 17px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Good Quotes.</h1>

    <div class="quote-card">
        <p class="quote-text">“Practice makes it perfect.”</p>
    </div>

    <div class="quote-card">
        <p class="quote-text">“The Goodness of Fit.”</p>
    </div>
    
    <a href="index.html" class="back-link">← Back to home</a>

</body>
</html>
